[package]
name = "voxa-client"
description = "Voxa voice, chat and screen sharing client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "voxa"
path = "src/main.rs"

[dependencies]
voxa-proto = { path = "../voxa-proto", features = ["update"] }
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "clipboard"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
parking_lot = "0.12"
rfd = "0.18.0"
rusty-opus = "1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22"
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"
tokio = { version = "1.54.1", features = ["full"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tray-icon = "0.26.1"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"] }
epaint = { version = "0.37.0", features = ["color_fonts"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_Xps", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_UI_Input_XboxController", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

# COM objects (#[implement]) for the screen share audio capture.
windows-core = "0.62"

# In-client video player (YouTube) on the WebView2 runtime that ships with Windows.
wry = { version = "0.57.1", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
