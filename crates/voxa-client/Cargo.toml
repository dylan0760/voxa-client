[package]
name = "voxa-client"
description = "Voxa voice, chat and screen sharing client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "voxa"
path = "src/main.rs"

[dependencies]
voxa-proto = { path = "../voxa-proto", features = ["update"] }
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "clipboard"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
parking_lot = "0.12"
rfd = "0.18.0"
rusty-opus = "1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_Xps", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Media_Audio", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
